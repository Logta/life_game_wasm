name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup mise (node/bun/rust versions from mise.toml)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true

    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # 旧 rustwasm org のインストーラ（curl | sh）は使わず、wasm-bindgen/wasm-pack の
    # リリースバイナリを SHA256 検証してから配置する（book-garden と同じ方式）。
    - name: Install wasm-pack (prebuilt binary, checksum verified)
      env:
        WASM_PACK_VERSION: "0.15.0"
        WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
      run: |
        set -euo pipefail
        archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -sSfL -o "/tmp/${archive}" \
          "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}"
        echo "${WASM_PACK_SHA256}  /tmp/${archive}" | sha256sum -c -
        tar -xzf "/tmp/${archive}" -C /tmp
        install -m 755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" ~/.cargo/bin/wasm-pack

    - name: Install dependencies
      run: bun install

    - name: Run Rust tests
      run: cargo test --verbose

    - name: Run Rust clippy
      run: cargo clippy -- -D warnings

    - name: Check Rust formatting
      run: cargo fmt -- --check

    - name: Build WebAssembly (dev)
      run: wasm-pack build --target web --out-name life_game_wasm --dev

    - name: Run TypeScript type check
      run: bun run typecheck

    - name: Run oxlint
      run: bun run lint

    - name: Build with Vite
      run: bun run build

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup mise (node/bun/rust versions from mise.toml)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true

    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # 旧 rustwasm org のインストーラ（curl | sh）は使わず、wasm-bindgen/wasm-pack の
    # リリースバイナリを SHA256 検証してから配置する（book-garden と同じ方式）。
    - name: Install wasm-pack (prebuilt binary, checksum verified)
      env:
        WASM_PACK_VERSION: "0.15.0"
        WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
      run: |
        set -euo pipefail
        archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -sSfL -o "/tmp/${archive}" \
          "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}"
        echo "${WASM_PACK_SHA256}  /tmp/${archive}" | sha256sum -c -
        tar -xzf "/tmp/${archive}" -C /tmp
        install -m 755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" ~/.cargo/bin/wasm-pack

    - name: Install dependencies
      run: bun install

    - name: Build WebAssembly (release)
      run: wasm-pack build --target web --out-name life_game_wasm --release

    - name: Build production
      run: bun run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup mise (node/bun/rust versions from mise.toml)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: true

    - name: Security audit
      run: |
        cargo install cargo-audit
        cargo audit

    - name: Install dependencies
      run: bun install

    - name: Audit dependencies
      run: bun audit --audit-level moderate