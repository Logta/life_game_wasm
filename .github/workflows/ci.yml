name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup mise (node/bun/rust versions from mise.toml)
      uses: jdx/mise-action@v4
      with:
        install: true
        cache: true

    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Install dependencies
      run: bun install

    - name: Run Rust tests
      run: cargo test --verbose

    - name: Run Rust clippy
      run: cargo clippy -- -D warnings

    - name: Check Rust formatting
      run: cargo fmt -- --check

    - name: Build WebAssembly (dev)
      run: wasm-pack build --target web --out-name life_game_wasm --dev

    - name: Run TypeScript type check
      run: bun run typecheck

    - name: Run oxlint
      run: bun run lint

    - name: Build with Vite
      run: bun run build

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v7

    - name: Setup mise (node/bun/rust versions from mise.toml)
      uses: jdx/mise-action@v4
      with:
        install: true
        cache: true

    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Install dependencies
      run: bun install

    - name: Build WebAssembly (release)
      run: wasm-pack build --target web --out-name life_game_wasm --release

    - name: Build production
      run: bun run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup mise (node/bun/rust versions from mise.toml)
      uses: jdx/mise-action@v4
      with:
        install: true
        cache: true

    - name: Security audit
      run: |
        cargo install cargo-audit
        cargo audit

    - name: Install dependencies
      run: bun install

    - name: Audit dependencies
      run: bun audit --audit-level moderate || true